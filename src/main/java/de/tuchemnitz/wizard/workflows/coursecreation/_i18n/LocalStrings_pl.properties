mail.body.0=*** To jest automatycznie wygenerowana wiadomo\u015b\u0107. Nie odpowiadaj na t\u0119 wiadomo\u015b\u0107\! ***\n\n W\u0142a\u015bnie pomy\u015blnie utworzy\u0142e\u015b sw\u00f3j kurs "{0}" w OpenOlat\!\n\n W tej wiadomo\u015bci e-mail chcieliby\u015bmy przekaza\u0107 kilka wskaz\u00f3wek i porad dotycz\u0105cych dalszej pracy z kursem\:
mail.body.1=1. znalezienie kursu\:\n - Mo\u017cesz znale\u017a\u0107 sw\u00f3j kurs w obszarze autora w zak\u0142adce "Moje wpisy".
mail.body.2=2. link do kursu poza OpenOlat\:\n - U\u017cyj tego linku, aby umie\u015bci\u0107 link do swojego kursu na stronie internetowej swojego wydzia\u0142u, na przyk\u0142ad\:\n - {0}
mail.body.3=3. wprowad\u017a kurs do katalogu OpenOlat\:\n - W ustawieniach kursu, w rozwijanym menu znajdziesz pozycj\u0119 "Wpis do katalogu". Kliknij na ni\u0105 i dodaj kurs do katalogu poprzez "Dodaj do katalogu".
mail.body.4=4. wprowadzanie zmian w kursie\:\n 4.1 Og\u00f3lne\:\n - Zasadniczo mo\u017cesz wprowadza\u0107 zmiany funkcjonalne w edytorze swojego kursu.
mail.body.4.2=4.{0} Strona informacyjna\:\n - Aby zmieni\u0107 zawarto\u015b\u0107 strony, kliknij "Edytuj" w widoku zawarto\u015bci kursu w elemencie kursu "Strona informacyjna".
mail.body.4.3=4.{0} Enrolment\:\n - Mo\u017cesz zarz\u0105dza\u0107 list\u0105 zapisanych uczestnik\u00f3w w "Grupach". Mo\u017cna to znale\u017a\u0107 w menu rozwijanym w sekcji "Zarz\u0105dzanie cz\u0142onkami".
mail.body.4.4=4.{0} Folder materia\u0142\u00f3w\:\n - Pliki mo\u017cna przesy\u0142a\u0107 i zarz\u0105dza\u0107 nimi bezpo\u015brednio w widoku tre\u015bci kursu w elemencie kursu "Folder materia\u0142\u00f3w".
mail.body.4.5=4.{0} Forum\:\n - Otw\u00f3rz forum z pierwszym postem klikaj\u0105c na "Otw\u00f3rz temat dyskusji" na forum. Wskaz\u00f3wka\: Subskrybuj forum, aby by\u0107 automatycznie informowanym o postach innych u\u017cytkownik\u00f3w przez e-mail, RSS i w domu OpenOlat\!
mail.body.4.6=4.{0} Email\:\n - Aby doda\u0107 dodatkowych odbiorc\u00f3w, otw\u00f3rz edytor i kliknij "Odbiorcy" w elemencie kursu "E-mail".
mail.body.5=5. wsparcie OpenOlat\:\n - Je\u015bli masz jakiekolwiek problemy lub pytania bez odpowiedzi, osoby kontaktowe wsparcia OpenOlat ch\u0119tnie Ci pomog\u0105.
mail.body.6=6. dalsza pomoc\:\n - W pomocy OpenOlat pod adresem {0} mo\u017cna znale\u017a\u0107 dalsze informacje na temat tworzenia i edytowania kurs\u00f3w.
