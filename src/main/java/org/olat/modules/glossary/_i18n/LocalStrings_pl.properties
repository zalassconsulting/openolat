edit.intro=Domy\u015blnie tylko w\u0142a\u015bciciele glosariusza mog\u0105 tworzy\u0107 i edytowa\u0107 wpisy. Wyb\u00f3r opcji "Autoryzacja zapisu dla wszystkich u\u017cytkownik\u00f3w" umo\u017cliwia wszystkim u\u017cytkownikom systemu tworzenie nowych wpis\u00f3w glosariusza, edytowanie wpis\u00f3w, kt\u00f3re sami utworzyli i ich ponowne usuwanie. W\u0142a\u015bciciele mog\u0105 w dowolnym momencie zmienia\u0107 lub usuwa\u0107 wpisy utworzone przez innych u\u017cytkownik\u00f3w.<br /><br />Je\u015bli ta funkcja jest aktywna, obok wpisu w glosariuszu wy\u015bwietlany jest odpowiedni autor i ostatnia osoba, kt\u00f3ra wprowadzi\u0142a zmiany.
edit.onoff=Zezw\u00f3l na autoryzacj\u0119 zapisu dla wszystkich u\u017cytkownik\u00f3w
edit.title=Autoryzacja zapisu
register.intro=Rejestr alfabetyczny jest przeznaczony dla alfabetu \u0142aci\u0144skiego i zawiera znaki od A-Z. W przypadku glosariusza z innym zestawem znak\u00f3w rejestr ten nale\u017cy wy\u0142\u0105czy\u0107.
