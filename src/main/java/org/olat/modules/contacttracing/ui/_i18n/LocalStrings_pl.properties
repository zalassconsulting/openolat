contact.tracing.locations.import.instructions=<p>Aby zaimportowa\u0107 lokalizacje do \u015bledzenia kontakt\u00f3w, pobierz szablon podany poni\u017cej, wype\u0142nij go, zaznacz i skopiuj wszystkie wiersze z wyj\u0105tkiem nag\u0142\u00f3wka, a nast\u0119pnie wklej je w polu tekstowym poni\u017cej.</p><p>Dost\u0119pne s\u0105 nast\u0119puj\u0105ce opcje. Wa\u017cne jest, aby zachowa\u0107 dok\u0142adnie tak\u0105 sam\u0105 kolejno\u015b\u0107 kolumn.</p><ul><li>Odno\u015bnik</li><li>Tytu\u0142</li><li>Budynek</li><li>Pomieszczenie</li><li>Sektor</li><li>Stolik</li><li>Miejsce (je\u015bli dost\u0119pne dla tej lokalizacji, wpisz "{0}" w T, w przeciwnym razie "{1}")</li><li>Go\u015b\u0107 (je\u015bli dost\u0119pne dla go\u015bci, wpisz "{2}", w przeciwnym razie "{3}")</li><li>QR ID (opcjonalnie, pozostaw to pole puste, je\u015bli chcesz automatycznie generowa\u0107 identyfikatory)</li><li>Tekst QR (opcjonalnie, wprowad\u017a HTML, aby sformatowa\u0107 tekst)</li></ul><p>Mo\u017cesz tak\u017ce zmieni\u0107 istniej\u0105ce lokalizacje. Je\u015bli lokalizacja ju\u017c istnieje w systemie, zostanie oznaczona tr\u00f3jk\u0105tem ostrzegawczym w nast\u0119pnym kroku.</p>
