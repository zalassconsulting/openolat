contact.tracing.registration.intro=<p>Zamierzasz zarejestrowa\u0107 swoj\u0105 obecno\u015b\u0107 w nast\u0119puj\u0105cej lokalizacji. Ten proces rejestracji opiera si\u0119 na wymogach prawa pandemicznego.</p>\r\n<p>Twoje dane s\u0105 przechowywane prywatnie i nie s\u0105 powi\u0105zane z Twoim kontem.</p>\r\n<p>Twoja obecno\u015b\u0107 nie mo\u017ce by\u0107 przegl\u0105dana przez wyk\u0142adowc\u00f3w ani administracj\u0119 kursu. <br />Raporty mog\u0105 by\u0107 generowane wy\u0142\u0105cznie na \u017c\u0105danie upowa\u017cnionych przedstawicieli federalnych. <br />Wszystkie zarejestrowane dane zostan\u0105 automatycznie usuni\u0119te po up\u0142ywie {0} dni.</p> {1}
