reminder.reminder1.body=<h1>$titleDzie\u0144 dobry</h1>$firstName $lastName<br/><br/>Niniejszym zapraszamy do wzi\u0119cia udzia\u0142u w ankiecie "$title".<br/><br/><div class\="o_email_button_group"><a class\="o_email_button" href\="$url">Otwarta ankieta</a></div><br/><br/>Uprzejmie zaprosili\u015Bmy Ci\u0119 na stronie <b>$invitation</b> do wzi\u0119cia udzia\u0142u w wys\u0142anej do Ciebie ankiecie. Niestety nie otrzymali\u015Bmy jeszcze odpowiedzi. Prosimy o po\u015Bwi\u0119cenie czasu na wype\u0142nienie kwestionariusza. W ten spos\u00F3b pomo\u017Cesz nam stale ulepsza\u0107 nasze us\u0142ugi jako instytucji edukacyjnej.<br/><br/><strong>Przedmiot oceny\: $topictype $topic$context</strong><br/><br/>Ankieta ko\u0144czy si\u0119 w dniu <strong>$deadline</strong>. Po tym terminie nie b\u0119dzie ju\u017C mo\u017Cliwo\u015Bci wzi\u0119cia udzia\u0142u w ankiecie.<br/><br/>Dzi\u0119kujemy bardzo\!<br/><br/>Z powa\u017Caniem<br/>Your QM Officer
