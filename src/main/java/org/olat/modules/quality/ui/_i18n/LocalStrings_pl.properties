reminder.invitation.body=<h1>$titleDzie\u0144 dobry</h1>$firstName $lastName<br/><br/>Niniejszym zapraszamy do wzi\u0119cia udzia\u0142u w ankiecie "$title".<br/><br/><div class\="o_email_button_group"><a class\="o_email_button" href\="$url">Otwarta ankieta</a></div><br/><br/>Twoje odpowiedzi pomog\u0105 nam stale ulepsza\u0107 nasze us\u0142ugi jako instytucji edukacyjnej.<br/><br/><strong>Przedmiot oceny\: $topictype $topic$context</strong><br/><br/>Ankieta ko\u0144czy si\u0119 w dniu <strong>$deadline</strong>. Po tym terminie udzia\u0142 w ankiecie nie b\u0119dzie mo\u017Cliwy.<br/><br/>Dzi\u0119kujemy bardzo\!<br/><br/>Pozdrawiamy<br/>Tw\u00F3j QM Officer
