admin.configuration.title=Pula pyta\u0144
admin.levels.intro=Utw\u00f3rz dost\u0119pne poziomy, kt\u00f3re maj\u0105 sens dla twojego poziomu edukacji. Przyk\u0142ady poziom\u00f3w w kontek\u015bcie szkolnym to Ni\u017cszy poziom, wy\u017cszy poziom, gimnazjum, licencjat, magister. W kontek\u015bcie firmy poziomy mog\u0105 wygl\u0105da\u0107 nast\u0119puj\u0105co\: bez szkolenia zawodowego, ze szkoleniem zawodowym, funkcja kierownicza, administracja, kadra, zarz\u0105dzanie
admin.licenses.intro=Utw\u00f3rz dodatkowe typy licencji, je\u015bli standardowe typy licencji OpenOlat nie s\u0105 wystarczaj\u0105ce. Standardowych typ\u00f3w licencji nie mo\u017cna usun\u0105\u0107.
admin.pool.manager.title=Uprawnienia administratora puli
admin.pools.intro=Utw\u00f3rz jedn\u0105 lub wi\u0119cej pul pyta\u0144. Pula pyta\u0144 to baza danych pyta\u0144, kt\u00f3ra jest dost\u0119pna dla wszystkich autor\u00f3w systemu w celu wymiany pyta\u0144 (publiczne). Opcjonalnie pula pyta\u0144 mo\u017ce by\u0107 r\u00f3wnie\u017c ograniczona do kilku autor\u00f3w, np. pracownik\u00f3w dzia\u0142u (niepubliczna).
admin.review.process.decision.type=Metoda oceny
admin.review.process.title=Proces oceny
admin.start.indexer=Po w\u0142\u0105czeniu i wy\u0142\u0105czeniu tej opcji nale\u017cy uruchomi\u0107 indeksator wyszukiwania pe\u0142notekstowego, aby w wyszukiwaniu wy\u015bwietlane by\u0142y prawid\u0142owe wyniki.
admin.studyfields.intro=Obszary tematyczne s\u0142u\u017c\u0105 do kategoryzacji pyta\u0144 wed\u0142ug przedmiotu. Jest to hierarchiczna struktura, kt\u00f3ra og\u00f3lnie odwzorowuje mo\u017cliwe programy studi\u00f3w. Wybierz przycisk "$org.olat.modules.taxonomy.ui\:add.taxonomy.level", aby doda\u0107 nowy obszar tematyczny. Wybierz istniej\u0105cy obszar tematyczny, aby go edytowa\u0107.
admin.types.intro=Utw\u00f3rz dodatkowe typy pyta\u0144, je\u015bli standardowe typy pyta\u0144 OpenOlat nie s\u0105 wystarczaj\u0105ce. Standardowe typy pyta\u0144 nie mog\u0105 zosta\u0107 usuni\u0119te.
