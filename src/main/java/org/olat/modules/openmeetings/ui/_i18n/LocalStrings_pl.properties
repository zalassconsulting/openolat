room.moderation.mode=Moderacja
room.moderation.mode.desc=Je\u015Bli opcja ta jest w\u0142\u0105czona w panelu administracyjnym, mo\u017Cna jej u\u017Cy\u0107 do wymuszenia obecno\u015Bci moderatora. Osoby nieb\u0119d\u0105ce moderatorami nie mog\u0105 wykonywa\u0107 \u017Cadnych dzia\u0142a\u0144 w pokoju, dop\u00F3ki moderator nie wejdzie do pokoju. moderator wchodzi do pokoju. W kursach moderatorami s\u0105 autorzy kursu i osoby nadzoruj\u0105ce kurs; w grupach s\u0105 to osoby nadzoruj\u0105ce grup\u0119.
