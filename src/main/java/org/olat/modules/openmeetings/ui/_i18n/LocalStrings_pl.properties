room.type.desc=Typ spotkania. Ma to wp\u0142yw na dost\u0119pne narz\u0119dzia i prawa moderacji w pokoju spotka\u0144. Konferencje s\u0105 przeznaczone dla mniejszej liczby u\u017Cytkownik\u00F3w, gdzie wszyscy uczestnicy maj\u0105 r\u00F3wny dost\u0119p do sygna\u0142u wideo i mog\u0105 korzysta\u0107 ze wszystkich narz\u0119dzi. Z drugiej strony webinarium odpowiada wyk\u0142adowi z prezenterem z sygna\u0142em wideo i wieloma s\u0142uchaczami. Wywiad to sesja, w kt\u00F3rej przeprowadzany jest wywiad z osob\u0105, a rozmowa jest nagrywana.
