disclaimer.paragraph1=<strong>Zgoda na przetwarzanie danych osobowych</strong><br/><br/>Wyra\u017Cam zgod\u0119 na przetwarzanie moich danych osobowych przez Suzuki Motor Poland Sp. z o.o. z siedzib\u0105 Warszawie (\u201ESMP\u201D) dla cel\u00F3w przeprowadzania programu rozwoju zawodowego dla pracownik\u00F3w lub os\u00F3b wsp\u00F3\u0142pracuj\u0105cych z sieci\u0105 dystrybutor\u00F3w i serwis\u00F3w Suzuki w Polsce poprzez system szkole\u0144 (\u201EProgram\u201D), w tym za po\u015Brednictwem Platformy Szkoleniowej Suzuki. (\u201EPlatforma\u201D)<br/><br/>Jestem \u015Bwiadoma(y), \u017Ce podanie danych osobowych jest dobrowolne, jak te\u017C \u017Ce mam prawo dost\u0119pu do moich danych, prawo do ich poprawiania oraz prawo cofni\u0119cia zgody na przetwarzanie danych w ka\u017Cdym czasie.<br/><br/>Wyra\u017Cam zgod\u0119 na otrzymywanie korespondencji w sprawach Programu drog\u0105 internetow\u0105.
disclaimer.paragraph2=<strong>Klauzula informacyjna</strong><br/><br/>Administratorem podanych przez Pa\u0144stwa danych osobowych jest Suzuki Motor Poland Sp. z o.o. z siedzib\u0105 w Warszawie przy ul. Po\u0142czy\u0144skiej 10 (tel. 22 329 41 00). Podane dane osobowe b\u0119d\u0105 przetwarzane w celu przeprowadzania Programu, w tym szkole\u0144. Podanie danych osobowych jest dobrowolne, ale konieczne do zapisania si\u0119 do Platformy.<br/><br/>Podstaw\u0119 przetwarzania Pa\u0144stwa danych stanowi do dnia 24 maja 2018 r. art. 23 ust. 1 pkt 1 i 2 ustawy z dnia 29.08.1997 r. o ochronie danych osobowych a po tym dniu art. 6 ust. 1 lit. a) i c) Rozporz\u0105dzenia Parlamentu Europejskiego i Rady (UE) 2016/679 z dnia 27.04.2016 r. w sprawie ochrony os\u00F3b fizycznych w zwi\u0105zku z przetwarzaniem danych osobowych i w sprawie swobodnego przep\u0142ywu takich danych oraz uchylenia dyrektywy 95/46/WE.<br/><br/>Pa\u0144stwa dane osobowe b\u0119d\u0105 przechowywane w czasie zatrudnienia (na podstawie umowy o prac\u0119 b\u0105d\u017A innej umowy) w sieci Suzuki, a po ustaniu zatrudnienia przez okres wymagany obowi\u0105zkami na\u0142o\u017Conymi na administratora przepisami prawa, w szczeg\u00F3lno\u015Bci przepisami dotycz\u0105cymi odpowiedzialno\u015Bci za niewykonanie lub nienale\u017Cyte wykonanie zobowi\u0105za\u0144 zwi\u0105zanych z Programem.<br/><br/>Odbiorcami Pa\u0144stwa danych osobowych mog\u0105 by\u0107 wybrani pracownicy i wsp\u00F3\u0142pracownicy SMP, podmioty prowadz\u0105ce szkolenia, trenerzy przeprowadzaj\u0105cy szkolenia, wybrane osoby odpowiedzialne za dzia\u0142anie Platformy, a tak\u017Ce wybrani przedstawiciele podmiotu wchodz\u0105cego w sk\u0142ad autoryzowanej sieci Suzuki, w kt\u00F3rym jeste\u015Bcie Pa\u0144stwo zatrudnieni - w zakresie w jakim takie osoby/ podmioty s\u0105 zwi\u0105zane z realizacj\u0105 Programu.<br/><br/>Na zasadach okre\u015Blonych w powo\u0142anych powy\u017Cej przepisach macie Pa\u0144stwo prawo: dost\u0119pu do swoich danych osobowych, ich sprostowania, usuni\u0119cia lub ograniczenia przetwarzania, przenoszenia danych (po 25 maja 2018 r.), a tak\u017Ce prawo wniesienia sprzeciwu wobec przetwarzania danych oraz cofni\u0119cia zgody na przetwarzanie danych w ka\u017Cdym czasie (w tym celu mo\u017Cna wys\u0142a\u0107 wiadomo\u015B\u0107 na adres: dane.osobowe@suzuki.com.pl). Kontakt do Inspektora Ochrony Danych w Suzuki Motor Poland Sp. z o.o.: inspektor@suzuki.com.pl]. (dotyczy okresu po 25 maja 2018 r.)<br/><br/>Przys\u0142uguje Pa\u0144stwu tak\u017Ce prawo wniesienia skargi do Generalnego Inspektora Ochrony Danych Osobowych, a po 25 maja 2018 roku do Prezesa Urz\u0119du Ochrony Danych Osobowych w razie uznania, \u017Ce dosz\u0142o do naruszenia przepis\u00F3w o ochronie danych osobowych.<br/><br/>
