about.history=System zarz\u0105dzania nauczaniem OpenOlat jest rozwijany w spo\u0142eczno\u015Bci OpenOlat od 2011 roku. OpenOlat jest rozwidleniem otwartego systemu LMS OLAT Uniwersytetu w Zurychu i jest u\u017Cywany w instytucjach edukacyjnych i firmach na ca\u0142ym \u015Bwiecie. OpenOlat jest produktem open source i mo\u017Ce by\u0107 swobodnie u\u017Cywany i modyfikowany.
