about.elearningjournal.test.2015=Renomowane czasopismo eLearning oceni\u0142o LMS OpenOlat jako "bardzo dobry" w kompleksowym te\u015Bcie por\u00F3wnawczym LMS. Tym samym OpenOlat znalaz\u0142 si\u0119 w \u015Bcis\u0142ej czo\u0142\u00F3wce. Szczeg\u00F3lnie podkre\u015Blono szeroki zakres funkcji rozwi\u0105zania open source OpenOlat.
