Q-1=... \u017ce mo\u017cesz by\u0107 powiadamiany o zmianach na forach, w folderach, kalendarzach, wiki i innych modu\u0142ach?
Q-10=... \u017ce mo\u017cna przegl\u0105da\u0107 wizyt\u00f3wki innych u\u017cytkownik\u00f3w OpenOlat?
Q-11=... \u017ce mo\u017cna udost\u0119pnia\u0107 w\u0142asne dokumenty innym u\u017cytkownikom?
Q-12=... \u017ce mo\u017cna organizowa\u0107 wirtualne klasy, spotkania lub wyk\u0142ady w OpenOlat?
Q-13=... \u017ce pomoc kontekstowa jest dost\u0119pna w niekt\u00f3rych obszarach z polami wej\u015bciowymi?
Q-14=... \u017ce mo\u017cna \u0142atwo odwo\u0142ywa\u0107 si\u0119 do kurs\u00f3w za po\u015brednictwem zewn\u0119trznego \u0142\u0105cza?
Q-15=... \u017ce mo\u017cna cz\u0119\u015bciowo wy\u015bwietli\u0107 obszar zawarto\u015bci kursu w nowym oknie?
