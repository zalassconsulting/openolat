#Wed Jul 09 13:06:41 CEST 2025
A-0=Grup\u0119 robocz\u0105 mo\u017cna utworzy\u0107 w sekcji "Grupy". Tam masz mo\u017cliwo\u015b\u0107 wymiany dokument\u00f3w i korzystania z kalendarza, wiki, czatu lub forum.
A-1=Po prostu kliknij przycisk "Subskrybuj" w elemencie kursu, a b\u0119dziesz regularnie informowany e-mailem o wszystkich zmianach na tym forum, wiki itp. bez konieczno\u015bci logowania si\u0119 do OpenOlat. Mo\u017cesz dostosowa\u0107 ustawienia powiadomie\u0144 w swoim Home.
A-10=Kliknij na link "Inni u\u017cytkownicy" w Home i wyszukaj osob\u0119, kt\u00f3rej szukasz. Masz mo\u017cliwo\u015b\u0107 wy\u015bwietlenia wizyt\u00f3wki konta OpenOlat, kt\u00f3rego szukasz, przegl\u0105dania jego folderu publicznego i skontaktowania si\u0119 z nim przez e-mail.
A-11=Umie\u015b\u0107 dokumenty, kt\u00f3re inni u\u017cytkownicy OpenOlat powinni m\u00f3c przegl\u0105da\u0107 w folderze osobistym w tak zwanym folderze "publicznym". Inni u\u017cytkownicy mog\u0105 znale\u017a\u0107 dokumenty, klikaj\u0105c "Inni u\u017cytkownicy" w sekcji Strona g\u0142\u00f3wna, wpisuj\u0105c swoje imi\u0119 i nazwisko, a nast\u0119pnie uzyskuj\u0105c dost\u0119p do folderu.
A-12=OpenOlat oferuje r\u00f3\u017cne modu\u0142y kurs\u00f3w do organizowania wirtualnych klas, spotka\u0144 lub wydarze\u0144. Obs\u0142ugiwane produkty to Vitero Teamroom, OpenMeetings, Adobe Connect i Wimba. Aby m\u00f3c korzysta\u0107 z jednego z tych produkt\u00f3w, Twoja instytucja musi obs\u0142ugiwa\u0107 taki produkt lub posiada\u0107 licencj\u0119 i odpowiednio skonfigurowa\u0107 OpenOlat. Zapytaj swojego operatora systemu\!
A-13=W nag\u0142\u00f3wku OpenOlat pomoc jest po\u0142\u0105czona za pomoc\u0105 znaku zapytania w niebieskim k\u00f3\u0142ku. Przycisk ten znajduje si\u0119 r\u00f3wnie\u017c w prawym g\u00f3rnym rogu obszar\u00f3w z polami wej\u015bciowymi. Klikni\u0119cie go powoduje wy\u015bwietlenie pomocy kontekstowej w wyskakuj\u0105cym okienku. W tym oknie mo\u017cna r\u00f3wnie\u017c wy\u015bwietli\u0107 wszystkie inne tematy pomocy kontekstowej.
A-14=W widoku szczeg\u00f3\u0142owym kursu bezpo\u015bredni link do kursu jest wy\u015bwietlany w sekcji "Informacje o wpisie" w sekcji "Zewn\u0119trzny link do tego zasobu edukacyjnego".
A-15=Mo\u017cesz wy\u015bwietla\u0107 elementy kursu, takie jak poszczeg\u00f3lne strony, forum i wiki w nowym oknie i jednocze\u015bnie nawigowa\u0107 do innej lokalizacji w OpenOlat w oknie g\u0142\u00f3wnym.
A-16=Status komunikatora mo\u017cna zmieni\u0107 za pomoc\u0105 zielonej gwiazdki w nag\u0142\u00f3wku. Pozwala to \u0142atwo sprawdzi\u0107, czy i w jaki spos\u00f3b jeste\u015b dost\u0119pny. Do wyboru s\u0105 nast\u0119puj\u0105ce opcje\: "Dost\u0119pny", "Chc\u0119 rozmawia\u0107", "Nieobecny", "D\u0142u\u017csza nieobecno\u015b\u0107", "Nie przeszkadza\u0107" lub "Niedost\u0119pny".
A-17=Obok zielonej gwiazdki w nag\u0142\u00f3wku w nawiasach wy\u015bwietlana jest liczba znajomych z grupy dost\u0119pnych na czacie. Kliknij j\u0105, aby otworzy\u0107 list\u0119 znajomych z grupy, kt\u00f3rzy s\u0105 aktualnie online. Mo\u017cesz r\u00f3wnie\u017c wy\u015bwietli\u0107 ich wed\u0142ug przynale\u017cno\u015bci do grupy.
A-18=W widoku kursu dost\u0119pna jest funkcja "Ustaw zak\u0142adk\u0119" w polu "Og\u00f3lne" po prawej stronie. Wszystkie zak\u0142adki mo\u017cna wywo\u0142a\u0107 w widoku strony g\u0142\u00f3wnej. Z tego miejsca mo\u017cna \u0142atwo otwiera\u0107 kursy.
A-19=Za jego pomoc\u0105 mo\u017cna wyszukiwa\u0107 konkretnie w tek\u015bcie, opisie, tytule lub metadanych, wed\u0142ug autora lub daty (data utworzenia, ostatnia zmiana) zasobu edukacyjnego, a tak\u017ce w sekcjach, typach dokument\u00f3w lub typach plik\u00f3w.
A-2=W widoku zawarto\u015bci kursu dost\u0119pna jest funkcja Notatki w polu "Og\u00f3lne" po prawej stronie. Jej klikni\u0119cie otwiera okno, w kt\u00f3rym mo\u017cna utworzy\u0107 notatk\u0119 dla danego kursu. Mo\u017cesz wywo\u0142a\u0107 wszystkie swoje notatki razem w Home.
A-20=Wybierz kalendarz kursu w polu "Og\u00f3lne" po prawej stronie lub - je\u015bli jest dost\u0119pny - element kursu Kalendarz. Mo\u017cesz teraz doda\u0107 go do swojego osobistego kalendarza za pomoc\u0105 przycisku "Dodaj do pers. Calendar" w kalendarzu w sekcji Home.
A-21=W Home w zak\u0142adce "System" w sekcji "Ustawienia" mo\u017cesz skonfigurowa\u0107, czy chcesz otrzymywa\u0107 aktualizacje poczt\u0105 e-mail, np. "Codziennie", "Co tydzie\u0144" lub "Co miesi\u0105c". Mo\u017cna r\u00f3wnie\u017c zrezygnowa\u0107 z subskrypcji, wybieraj\u0105c opcj\u0119 "Nigdy".
A-22=W sekcji "Subskrypcje" mo\u017cna przegl\u0105da\u0107 zmiany w subskrybowanych zasobach w formie listy lub kana\u0142u RSS oraz zarz\u0105dza\u0107 subskrypcjami. Ka\u017cda nowa funkcja jest powi\u0105zana z odpowiednim zasobem i prowadzi bezpo\u015brednio do niego. Domy\u015blnie wy\u015bwietlane s\u0105 powiadomienia z ostatnich 24 godzin. Mo\u017cna jednak r\u00f3wnie\u017c wy\u015bwietli\u0107 zmiany od okre\u015blonej daty. Powiadomienia z ostatnich 30 dni s\u0105 wy\u015bwietlane w kanale RSS.
A-3=Wybierz "Subskrypcje" w osobistym menu g\u0142\u00f3wnym, a nast\u0119pnie zak\u0142adk\u0119 "Kana\u0142 wiadomo\u015bci RSS". Mo\u017cesz r\u00f3wnie\u017c doda\u0107 j\u0105 do zak\u0142adek. W ten spos\u00f3b zawsze b\u0119dziesz dobrze poinformowany o swoich powiadomieniach.
A-4=OpenOlat oferuje kompleksowe rozwi\u0105zanie e-portfolio. Za pomoc\u0105 narz\u0119dzia do gromadzenia mo\u017cna zbiera\u0107 osobiste artefakty i kompilowa\u0107 je w folderze portfolio dla innych u\u017cytkownik\u00f3w. Mo\u017cliwe jest r\u00f3wnie\u017c tworzenie portfolio grupowych i zada\u0144 portfolio.
A-5=OpenOlat mo\u017cna pobra\u0107 bezp\u0142atnie ze strony <a href\="http\://www.openolat.org" target\="_blank"><i class\="o_icon o_icon_link_extern"> </i> www.openolat.org.</a> Mo\u017cna tam r\u00f3wnie\u017c znale\u017a\u0107 listy mailingowe i inne informacje techniczne dotycz\u0105ce systemu zarz\u0105dzania nauczaniem OpenOlat.
A-6=OpenOlat oznacza <b>Online</b> <b>Learning</b> <b>And</b> <b>Training</b>i jest systemem zarz\u0105dzania nauczaniem typu open source.
A-7=Mo\u017cesz u\u017cy\u0107 linku "Konfiguruj stron\u0119", aby zmieni\u0107 kolejno\u015b\u0107 p\u00f3l na stronie g\u0142\u00f3wnej lub w og\u00f3le nie wy\u015bwietla\u0107 niekt\u00f3rych p\u00f3l.
A-8=Kliknij "Ustawienia" w menu g\u0142\u00f3wnym i wybierz zak\u0142adk\u0119 "Moja wizyt\u00f3wka". Mo\u017cesz okre\u015bli\u0107, kt\u00f3re informacje na Twoim profilu powinny by\u0107 widoczne dla wszystkich u\u017cytkownik\u00f3w OpenOlat. Mo\u017cesz r\u00f3wnie\u017c przes\u0142a\u0107 zdj\u0119cie, napisa\u0107 spersonalizowany tekst i og\u0142osi\u0107 swoje cz\u0142onkostwo w r\u00f3\u017cnych sieciach internetowych i komunikatorach.
A-9=Dokumenty mo\u017cna przechowywa\u0107 w folderze osobistym, do kt\u00f3rego mo\u017cna uzyska\u0107 dost\u0119p w dowolnym momencie. OpenOlat udost\u0119pnia w tym celu 20 MB pami\u0119ci.
