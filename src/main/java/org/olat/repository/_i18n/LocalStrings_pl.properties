wizard.step2.attention=<b>UWAGA\:</b> Je\u015Bli wybrano opcj\u0119 "Usu\u0144 wszystkich prze\u0142o\u017Conych i uczestnik\u00F3w z grup nauki i uprawnie\u0144 kursu", pracownicy i uczestnicy kursu mog\u0105 nie mie\u0107 ju\u017C pe\u0142nego dost\u0119pu do tre\u015Bci kursu. Osi\u0105gni\u0119cia uczestnik\u00F3w kursu, np. w testach, zadaniach itp., nie mog\u0105 by\u0107 ju\u017C przegl\u0105dane za pomoc\u0105 narz\u0119dzia oceny kursu.
wizard.step3.mail.body=*** To jest automatycznie wygenerowana wiadomo\u015B\u0107. Nie odpowiadaj na t\u0119 wiadomo\u015B\u0107\! ***\n\nKurs {0} zosta\u0142 anulowany przez osob\u0119 z uprawnieniami administratora tego kursu\: {1}.\n\nKurs nie jest ju\u017C prowadzony ani aktualizowany. Je\u015Bli subskrybowa\u0142e\u015B poszczeg\u00F3lne elementy kursu, mo\u017Cesz je anulowa\u0107 w swoim domu OpenOlat w menu po lewej stronie w sekcji "Powiadomienia". Twoje cz\u0142onkostwo w grupie w tym kursie mog\u0142o zosta\u0107 anulowane. Je\u015Bli masz dodatkowe pytania dotycz\u0105ce tego procesu, skontaktuj si\u0119 z opiekunem kursu pod adresem {1}.
wizard.step3.mail.subject=[OpenOlat] Kurs {0} zosta\u0142 zako\u0144czony
wizard.velocity.step1.par1=Do czego s\u0142u\u017Cy funkcja "Dezaktywuj"?
wizard.velocity.step1.par2=U\u017Cyj tego kreatora, aby ustawi\u0107 status tego kursu na <b>[nieaktywny]</b>. Poinformuje to uczestnik\u00F3w kursu, \u017Ce nie b\u0119dzie on ju\u017C edytowany i aktualizowany.
wizard.velocity.step1.par3=Jakie dodatkowe opcje oferuje funkcja "Dezaktywuj"?
wizard.velocity.step1.par3a=W kroku 2 kreatora mo\u017Cna <b>usun\u0105\u0107 wszystkie wpisy katalogowe dla tego kursu</b> oraz <b>usun\u0105\u0107 wszystkich opiekun\u00F3w i uczestnik\u00F3w z grup nauki i uprawnie\u0144 kursu</b>.
wizard.velocity.step1.par3b=W kroku 3 kreatora mo\u017Cna poinformowa\u0107 <b>wszystkich opiekun\u00F3w i uczestnik\u00F3w grup nauki i praw</b> kursu o dzia\u0142aniach podj\u0119tych w celu zako\u0144czenia kursu <b>za po\u015Brednictwem poczty elektronicznej</b>.
wizard.velocity.step1.par4=Do czego s\u0142u\u017Cy funkcja "Exit"?
wizard.velocity.step1.par4a=Konfiguracja kursu (ustawienia kursu, widoczno\u015B\u0107 i zasady dost\u0119pu) pozostaje niezmieniona.
wizard.velocity.step1.par4b=Wszyscy autoryzowani u\u017Cytkownicy nadal maj\u0105 dost\u0119p do tre\u015Bci kursu zgodnie z ich indywidualnymi uprawnieniami.<br /> UWAGA\: Je\u015Bli "usuniesz wszystkich opiekun\u00F3w i uczestnik\u00F3w z grup nauki i uprawnie\u0144 kursu", nie b\u0119dziesz ju\u017C mie\u0107 dost\u0119pu do osi\u0105gni\u0119\u0107 uczestnik\u00F3w kursu w testach, zadaniach itp. za po\u015Brednictwem narz\u0119dzia oceny.
wizard.velocity.step1.par4c=Wszystkie dane u\u017Cytkownika i transakcji (np. posty na forach i wiki) s\u0105 zachowywane i nadal mo\u017Cna uzyska\u0107 do nich dost\u0119p i je edytowa\u0107. <br />
wizard.velocity.step1.par4d=Wszystkie linki do zak\u0142adek tego kursu maj\u0105 status [uko\u0144czony].
wizard.velocity.step1.par4e=<b>UWAGA\: Zmiana statusu kursu <b>nie mo\u017Ce zosta\u0107 anulowana</b>.</b>
wizardsteptitledescription=Wprowad\u017A opis
wizardsteptitleproperties=Wprowadzanie ustawie\u0144
wizardsteptitleupload=Prze\u015Blij plik
year=Rok
