members.participants.info=Ta lista pokazuje u\u017Cytkownik\u00F3w z prawami uczestnika dla tego zasobu edukacyjnego. Osoby te maj\u0105 dost\u0119p do zasobu szkoleniowego po jego opublikowaniu. Wybierz przycisk "$\:members.add" lub "$\:members.import", aby umo\u017Cliwi\u0107 u\u017Cytkownikom dost\u0119p. <br />Je\u015Bli pracujesz z grupami szkoleniowymi, uczestnicy grup szkoleniowych tego zasobu szkoleniowego s\u0105 automatycznie dodawani do listy uczestnik\u00F3w. <br /> Je\u015Bli pracujesz z rezerwacjami, uczestnicy, kt\u00F3rzy zarezerwuj\u0105 ten zas\u00F3b edukacyjny, s\u0105 automatycznie wpisywani na t\u0119 list\u0119 uczestnik\u00F3w. <br /> Mo\u017Cesz usun\u0105\u0107 osob\u0119 z tej listy w dowolnym momencie. Osoba ta nie b\u0119dzie ju\u017C mia\u0142a dost\u0119pu do tego zasobu edukacyjnego.
