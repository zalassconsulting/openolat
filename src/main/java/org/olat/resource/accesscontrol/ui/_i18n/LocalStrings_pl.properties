members.tutors.info=Ta lista pokazuje u\u017Cytkownik\u00F3w z prawami nadzoru dla tego zasobu edukacyjnego. Osoby te maj\u0105 dost\u0119p do zasob\u00F3w edukacyjnych po ich opublikowaniu, analogicznie do uczestnik\u00F3w. W kursach opiekunowie maj\u0105 dost\u0119p do narz\u0119dzi takich jak narz\u0119dzie oceny. Wybierz przycisk "$\:members.add" lub "$\:members.import", aby przypisa\u0107 prawa nadzoru do u\u017Cytkownik\u00F3w. <br />Je\u015Bli pracujesz z zespo\u0142ami ucz\u0105cymi si\u0119, opiekunowie zespo\u0142\u00F3w ucz\u0105cych si\u0119 tego zasobu edukacyjnego s\u0105 automatycznie dodawani do listy opiekun\u00F3w.
